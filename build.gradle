import org.jetbrains.changelog.Changelog

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version '2.+'
    id 'com.github.breadmoirai.github-release' version '2.4.1'
    id 'org.jetbrains.changelog' version '2.2.1'
    id 'com.github.ben-manes.versions' version '0.51.0'
}

version = "$minecraft_version-$mod_version"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            property 'guideme.pccard.guide.sources', file('guidebook').absolutePath
            property 'guideme.pccard.guide.sourcesNamespace', mod_id
            property 'guideme.showOnStartup', 'pccard:index.md'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = "Mod Maven"
        url = "https://modmaven.dev/"
        content {
            includeGroup 'appeng'
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = "Registrate"
        url = "https://maven.tterrag.com/"
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = "firstdarkdev"
        url = "https://maven.firstdarkdev.xyz/snapshots"
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url "https://maven.shedaniel.me/" }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven { url = "https://maven.bawnorton.com/releases" }
    mavenLocal()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' // Mixin
    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1")
    implementation jarJar("io.github.llamalad7:mixinextras-forge:0.4.1") {
        jarJar.ranged(it, "[0.4.1,)")
    }
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.5-beta.2"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.5-beta.2")) {
        jarJar.ranged(it, "[0.3.5-beta.2,)")
    }

    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}") { transitive = false } // GregTech CEu: Modern
    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}") // AE2
    implementation fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") // JEI
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api") // EMI
    runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}") // EMI
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}") // Registrate
    compileOnly fg.deobf("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false } // ldlib
    compileOnly fg.deobf("curse.maven:advancedae-1084104:${adae_version}") // Advanced AE
    runtimeOnly fg.deobf("curse.maven:advancedae-1084104:${adae_version}") // Advanced AE
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:${geckolib_version}")
    compileOnly fg.deobf("curse.maven:extendedae-892005:${exae_version}") // Extended AE
    runtimeOnly fg.deobf("curse.maven:extendedae-892005:${exae_version}")
    runtimeOnly fg.deobf("curse.maven:glodium-957920:${glodium_version}")
    runtimeOnly fg.deobf("curse.maven:applied-flux-965012:${appflux_version}") // Applied Flux
    implementation fg.deobf("curse.maven:mae2-1028068:${mae2_version}") // MAE2
    runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_version}") // Jade
    compileOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}:api") // GuideME
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")
    compileOnly fg.deobf("curse.maven:expanded-ae-1213351:${expanded_ae_version}") // Expanded AE
    runtimeOnly fg.deobf("curse.maven:expanded-ae-1213351:${expanded_ae_version}")
    runtimeOnly fg.deobf("curse.maven:mega-cells-622112:${mega_cells_version}") // Mega Cells
    runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}") // Mega Cells
    runtimeOnly fg.deobf("curse.maven:applied-energistics-2-wireless-terminals-459929:${wireless_terminals_version}") // AE2 Wireless Terminals
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    runtimeOnly fg.deobf("curse.maven:architectury-api-419699:${architectury_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
            ae2_version_range   : ae2_version_range, gtm_version_range: gtm_version_range,
            guideme_version_range: guideme_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // GuideME guide
    from('guidebook') {
        into 'assets/pccard/guides/pccard/guide'
    }
}

mixin {
    add sourceSets.main, 'mixins.pccard.refmap.json'
    config 'mixins.pccard.json'

    mixin.debug.export = true
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
            changelog.get(mod_version).withHeader(false).withEmptySections(false),
            Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

curseforge {
    apiKey = System.getenv('CURSEFORGE_TOKEN') ?: ''
    // noinspection GroovyAssignabilityCheck
    project {
        id = '1150540'
        addGameVersion 'Java 17'
        addGameVersion 'Forge'
        addGameVersion '1.20.1'
        releaseType = project.version_type
        changelog = parserChangelog()
        changelogType = 'markdown'
        mainArtifact jar, {
            displayName = "${rootProject.name} ${project.version}"
            relations {
                requiredDependency 'applied-energistics-2'
                requiredDependency 'gregtechceu-modern'
                requiredDependency 'guideme'
                optionalDependency 'ex-pattern-provider'
                optionalDependency 'advancedae'
                incompatible 'expanded-ae'
                optionalDependency 'modern-ae2-additions'
                optionalDependency 'mega-cells'
                optionalDependency 'jei'
                optionalDependency 'emi'
            }
        }
    }
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN') ?: ''
    // Remember to have the MODRINTH_TOKEN environment variable set or else this will fail - just make sure it stays private!
    projectId = 'C3Mtqx9z' // This can be the project ID or the slug. Either will work!
    versionNumber = project.version as String
    versionName = "${rootProject.name} ${project.version}"
    // You don't need to set this manually. Will fail if Modrinth has this version already
    versionType = project.version_type // This is the default -- can also be `beta` or `alpha`
    uploadFile = jar // With Loom, this MUST be set to `remapJar` instead of `jar`!
    gameVersions = [project.minecraft_version] // Must be an array, even with only one version
    loaders = ['forge'] // Must also be an array - no need to specify this if you're using Loom or ForgeGradle
    changelog = parserChangelog()
    dependencies {
        required.project 'ae2'
        required.project 'gregtechceu-modern'
        required.project 'guideme'
        optional.project 'extended-ae'
        optional.project 'advancedae'
        incompatible.project 'expanded-ae'
        optional.project 'modern-ae2-additions'
        optional.project 'mega'
        optional.project 'jei'
        optional.project 'emi'
    }
}

githubRelease {
    token System.getenv('GITHUB_TOKEN') ?: '' // This is your personal access token with Repo permissions
    // You get this from your user settings > developer settings > Personal Access Tokens
    owner 'yuuki1293' // default is the last part of your group. Eg group: 'com.github.breadmoirai" => owner: "breadmoirai"
    repo 'ProgrammedCircuitCard' // by default this is set to your project name
    tagName "v${project.version}" // by default this is set to "v${project.version}"
    targetCommitish '1.20.1' // by default this is set to "main"
    releaseName "${rootProject.name} ${project.version}" // Release title, by default this is the same as the tagName
    generateReleaseNotes false // Generate release notes automatically, if true and body is present, body will be prepended, if name is not given, one will be generated by the tag
    body parserChangelog() // by default this is empty
    draft true // by default this is true
    prerelease false // by default this is false
    releaseAssets jar // this points to which files you want to upload as assets with your release, by default this is empty
    allowUploadToExisting.set false // Setting this to true will allow this plugin to upload artifacts to a release if it found an existing one. If overwrite is set to true, this option is ignored.
    overwrite false // by default false; if set to true, will delete an existing release with the same tag and name
    dryRun false // by default false; you can use this to see what actions would be taken without making a release
    apiEndpoint 'https://api.github.com' // should only change for github enterprise users
    client // This is the okhttp client used for http requests
}
