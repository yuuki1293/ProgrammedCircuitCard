import org.jetbrains.changelog.Changelog

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.103'
    id 'idea'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version '2.+'
    id 'com.github.breadmoirai.github-release' version '2.4.1'
    id 'org.jetbrains.changelog' version '2.2.1'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = "$minecraft_version-$mod_version"
group = mod_group_id

repositories {
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = "Mod Maven"
        url = "https://modmaven.dev/"
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = "Registrate"
        url = "https://mvn.devos.one/snapshots/"
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name 'Configuration'
        url 'https://api.repsy.io/mvn/toma/public/'
    }
    maven {
        name = "firstdarkdev"
        url = "https://maven.firstdarkdev.xyz/snapshots"
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url "https://maven.shedaniel.me" }
    mavenLocal()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            systemProperty 'mixin.debug.export', 'true'
        }

        guide {
            client()
            systemProperty 'guideme.ae2.guide.sources', file('guidebook').absolutePath
            // This is only needed if you are developing an addon and it should be your mod id
            systemProperty "guideme.ae2.guide.sourcesNamespace", "pccard"
            systemProperty('guideme.showOnStartup', 'ae2:index.md') // Start at index.md
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}"
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}" // AE2
    implementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}" // JEI
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api" // EMI
//    runtimeOnly "dev.emi:emi-forge:${emi_version}") // EMI
//    compileOnly "com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}" { transitive = false } // ldlib
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "dev.toma.configuration:configuration-${minecraft_version}:${configuration_version}-common"
    compileOnly "curse.maven:advancedae-1084104:${adae_version}" // Advanced AE
    runtimeOnly "curse.maven:advancedae-1084104:${adae_version}" // Advanced AE
    runtimeOnly "curse.maven:geckolib-388172:${geckolib_version}"
    compileOnly "curse.maven:extendedae-892005:${exae_version}" // Extended AE
    runtimeOnly "curse.maven:extendedae-892005:${exae_version}"
    runtimeOnly "curse.maven:glodium-957920:${glodium_version}"
    runtimeOnly "curse.maven:applied-flux-965012:${appflux_version}" // Applied Flux
//    runtimeOnly "curse.maven:mae2-1028068:${mae2_version}" // MAE2 Not in 1.21.1
    runtimeOnly "curse.maven:jade-324717:${jade_version}" // Jade
    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api" // GuideME
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
//    implementation "curse.maven:expanded-ae-1213351:${expanded_ae_version}" // Expanded AE
    runtimeOnly "curse.maven:mega-cells-622112:${mega_cells_version}" // Mega Cells
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            ae2_version_range      : ae2_version_range,
            gtm_version_range      : gtm_version_range,
            guideme_version_range  : guideme_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
            changelog.get(mod_version).withHeader(false).withEmptySections(false),
            Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

curseforge {
    apiKey = System.getenv('CURSEFORGE_TOKEN') ?: ''
    // noinspection GroovyAssignabilityCheck
    project {
        id = '1150540'
        addGameVersion 'Java 21'
        addGameVersion 'Forge'
        addGameVersion '1.21.1'
        releaseType = project.version_type
        changelog = parserChangelog()
        changelogType = 'markdown'
        mainArtifact jar, {
            displayName = "${rootProject.name} ${project.version}"
            relations {
                requiredDependency 'applied-energistics-2'
                requiredDependency 'gregtechceu-modern'
                requiredDependency 'guideme'
                optionalDependency 'ex-pattern-provider'
                optionalDependency 'advancedae'
                optionalDependency 'modern-ae2-additions'
                optionalDependency 'mega-cells'
                optionalDependency 'jei'
                optionalDependency 'emi'
            }
        }
    }
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN') ?: ''
    // Remember to have the MODRINTH_TOKEN environment variable set or else this will fail - just make sure it stays private!
    projectId = 'C3Mtqx9z' // This can be the project ID or the slug. Either will work!
    versionNumber = project.version as String
    versionName = "${rootProject.name} ${project.version}"
    // You don't need to set this manually. Will fail if Modrinth has this version already
    versionType = project.version_type // This is the default -- can also be `beta` or `alpha`
    uploadFile = jar // With Loom, this MUST be set to `remapJar` instead of `jar`!
    gameVersions = [project.minecraft_version] // Must be an array, even with only one version
    loaders = ['forge'] // Must also be an array - no need to specify this if you're using Loom or ForgeGradle
    changelog = parserChangelog()
    dependencies {
        required.project 'ae2'
        required.project 'gregtechceu-modern'
        required.project 'guideme'
        optional.project 'extended-ae'
        optional.project 'advancedae'
        optional.project 'modern-ae2-additions'
        optional.project 'mega'
        optional.project 'jei'
        optional.project 'emi'
    }
}

githubRelease {
    token System.getenv('GITHUB_TOKEN') ?: '' // This is your personal access token with Repo permissions
    // You get this from your user settings > developer settings > Personal Access Tokens
    owner 'yuuki1293' // default is the last part of your group. Eg group: 'com.github.breadmoirai" => owner: "breadmoirai"
    repo 'ProgrammedCircuitCard' // by default this is set to your project name
    tagName "v${project.version}" // by default this is set to "v${project.version}"
    targetCommitish '1.21.1' // by default this is set to "main"
    releaseName "${rootProject.name} ${project.version}" // Release title, by default this is the same as the tagName
    generateReleaseNotes false // Generate release notes automatically, if true and body is present, body will be prepended, if name is not given, one will be generated by the tag
    body parserChangelog() // by default this is empty
    draft true // by default this is true
    prerelease false // by default this is false
    releaseAssets jar // this points to which files you want to upload as assets with your release, by default this is empty
    allowUploadToExisting.set false // Setting this to true will allow this plugin to upload artifacts to a release if it found an existing one. If overwrite is set to true, this option is ignored.
    overwrite false // by default false; if set to true, will delete an existing release with the same tag and name
    dryRun false // by default false; you can use this to see what actions would be taken without making a release
    apiEndpoint 'https://api.github.com' // should only change for github enterprise users
    client // This is the okhttp client used for http requests
}
